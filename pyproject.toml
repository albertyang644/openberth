[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openberth"
version = "0.1.0"
description = "GTK tmux target organizer and launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Albert Yang" }]
keywords = ["gtk", "kde", "tmux", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/albertyang644/openberth"
Repository = "https://github.com/albertyang644/openberth"
Issues = "https://github.com/albertyang644/openberth/issues"

[project.scripts]
openberth = "openberth.app:main"
openberth-ui = "openberth.ui_app:main"
openberth-install-desktop = "openberth.desktop:main"

[tool.setuptools]
packages = ["openberth"]

[tool.setuptools.package-data]
openberth = ["resources/*"]

[tool.setuptools.data-files]
"share/applications" = ["openberth/resources/com.openberth.app.desktop"]
"share/icons/hicolor/scalable/apps" = ["openberth/resources/com.openberth.app.svg"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# The CSS template is one big printf-style block with named placeholders;
# f-strings would fight the literal braces in the CSS itself.
"openberth/ui_app.py" = ["UP031"]
# setUp/tearDown own the temp file's lifetime across test methods, which is
# exactly what a context manager cannot express.
"tests/*" = ["SIM115"]
