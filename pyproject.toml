[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openberth"
version = "0.1.0"
description = "GTK tmux target organizer and launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenBerth contributors" }]
keywords = ["gtk", "kde", "tmux", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

[project.scripts]
openberth = "openberth.app:main"
openberth-ui = "openberth.ui_app:main"
openberth-install-desktop = "openberth.desktop:main"

[tool.setuptools]
packages = ["openberth"]

[tool.setuptools.package-data]
openberth = ["resources/*"]

[tool.setuptools.data-files]
"share/applications" = ["openberth/resources/com.openberth.app.desktop"]
"share/icons/hicolor/scalable/apps" = ["openberth/resources/com.openberth.app.svg"]
